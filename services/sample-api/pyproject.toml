[project]
name = "sample-api"
version = "0.1.0"
description = "Sample service: items CRUD on Postgres (primary for writes, replicas for eventual reads)"
requires-python = ">=3.12"
dependencies = ["sdl-common[postgres]"]

[tool.uv.sources]
sdl-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_api"]
