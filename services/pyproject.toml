# uv workspace for every Python service in this lab.
#   make test                 -> unit tests for all members (no cluster needed)
#   make new-service N=<name> -> scaffold from _template (picked up by the glob below, no edit needed)
[tool.uv.workspace]
members = ["libs/*", "*"]      # every service folder (each needs a pyproject.toml; hidden dirs are ignored)
exclude = ["libs", "_template", "__pycache__"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx2>=2.13.1",  # starlette/fastapi TestClient backend (plain httpx is deprecated there)
    "pyyaml>=6.0.3",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 110
src = ["*/src"]  # service modules are first-party; sdl_common sorts with third-party
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
norecursedirs = ["_template", ".venv", "node_modules"]
