[project]
name = "sdl-common"
version = "0.1.0"
description = "Shared plumbing for lab services: app factory, health/readiness, logging, metrics, Postgres, migrations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdl_common"]
