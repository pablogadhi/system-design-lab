# The single entry point into the cluster: http://localhost:8080
#   - app traffic:   path-based on any host          (http://localhost:8080/api/<service>/...)
#   - tool UIs:      host-based on *.localhost        (http://grafana.localhost:8080)
# Envoy Gateway also plays the "API Gateway" box from design diagrams: rate limiting, JWT auth,
# retries/timeouts are configured per route with BackendTrafficPolicy / SecurityPolicy.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: sdl-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: sdl
      envoyService:
        type: NodePort
        # Cluster policy: the NodePort is mapped on the control-plane node, where no envoy pod runs.
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: sdl
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: sdl-proxy
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sdl
  namespace: envoy-gateway-system
spec:
  gatewayClassName: sdl
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
