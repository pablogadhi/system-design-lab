# ha: 1 primary + 2 async streaming replicas, one per zone. Kill the primary and CNPG promotes a replica.
# Experiment: switch to synchronous replication (no committed write lost on failover, higher latency):
#   spec.postgresql.synchronous: { method: any, number: 1 }
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: { kind: Cluster, name: postgres }
    patch: |-
      - op: replace
        path: /spec/instances
        value: 3
