openapi: 3.1.0
info:
  title: sample-api
  version: 0.1.0
  description: |
    Items CRUD on Postgres. Public base path: /api/sample-api (gateway strips it).
    Writes go to the primary; `source=replica` reads may lag behind (async replication).
servers:
  - url: /api/sample-api
paths:
  /items:
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemIn" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "422": { description: Validation error }
    get:
      operationId: listItems
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: source, in: query, schema: { type: string, enum: [primary, replica], default: primary } }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }
  /items/{item_id}:
    get:
      operationId: getItem
      parameters:
        - { name: item_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "404": { description: Item not found }
components:
  schemas:
    ItemIn:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    Item:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string, format: date-time }
